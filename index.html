```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Секундомер</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #171717;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;

            overflow: hidden;

            transition: background-color 0.3s ease,
                        background-image 0.3s ease;
        }

        /* Затемнение фона */
        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.25);

            pointer-events: none;
        }

        /* Основной контейнер */
        .container {
            position: relative;
            z-index: 2;

            text-align: center;

            padding: 30px;
        }

        /* Секундомер */
        .stopwatch {
            font-size: clamp(70px, 14vw, 190px);

            font-weight: 700;

            letter-spacing: 5px;

            line-height: 1;

            text-shadow:
                0 4px 25px rgba(0, 0, 0, 0.7);

            font-variant-numeric: tabular-nums;
        }

        /* Кнопки */
        .controls {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 40px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            padding: 14px 28px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.92);

            color: #111;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        button:hover {
            background: white;

            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Кнопка настроек */
        .settings-button {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 10;

            width: 48px;
            height: 48px;

            padding: 0;

            border-radius: 50%;

            font-size: 22px;
        }

        /* Панель настроек */
        .settings-panel {
            position: fixed;

            top: 80px;
            right: 20px;

            z-index: 10;

            width: 300px;

            padding: 20px;

            border-radius: 16px;

            background: rgba(20, 20, 20, 0.94);

            color: white;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5);

            display: none;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-panel h2 {
            margin-top: 0;

            margin-bottom: 20px;

            font-size: 20px;
        }

        .settings-panel label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-size: 14px;
        }

        .settings-panel input[type="color"] {
            width: 100%;

            height: 45px;

            padding: 0;

            border: none;

            cursor: pointer;
        }

        .settings-panel input[type="text"] {
            width: 100%;

            padding: 11px;

            border: 1px solid #555;

            border-radius: 8px;

            background: #292929;

            color: white;

            outline: none;

            font-size: 14px;
        }

        .settings-panel input[type="text"]:focus {
            border-color: #aaa;
        }

        .settings-panel .reset-background {
            width: 100%;

            margin-top: 20px;

            font-size: 15px;
        }

        .hint {
            margin-top: 12px;

            color: #aaa;

            font-size: 12px;

            line-height: 1.4;
        }

        /* Мобильные устройства */
        @media (max-width: 600px) {

            .stopwatch {
                font-size: 18vw;

                letter-spacing: 2px;
            }

            .controls {
                margin-top: 30px;
            }

            button {
                padding: 12px 20px;

                font-size: 16px;
            }

            .settings-panel {
                right: 10px;
                left: 10px;

                width: auto;
            }
        }
    </style>
</head>


<body>

    <div class="overlay"></div>


    <!-- Настройки -->

    <button
        class="settings-button"
        onclick="toggleSettings()"
        aria-label="Настройки"
    >
        ⚙
    </button>


    <div
        class="settings-panel"
        id="settingsPanel"
    >

        <h2>Настройки фона</h2>


        <label for="backgroundColor">
            Цвет фона
        </label>

        <input
            type="color"
            id="backgroundColor"
            value="#171717"
        >


        <label for="backgroundUrl">
            URL изображения
        </label>

        <input
            type="text"
            id="backgroundUrl"
            placeholder="https://example.com/image.jpg"
        >


        <button
            class="reset-background"
            onclick="resetBackground()"
        >
            Сбросить фон
        </button>


        <div class="hint">
            Настройки фона сохраняются в браузере
            и останутся после перезагрузки страницы.
        </div>

    </div>


    <!-- Секундомер -->

   <main class="container">

    <div class="title">
        КОФЕ-БРЕЙК
    </div>

    <div
        class="stopwatch"
        id="stopwatch"
    >
        00:00:00
    </div>


        <div class="controls">

            <button onclick="startStopwatch()">
                ▶ Старт
            </button>

            <button onclick="pauseStopwatch()">
                ⏸ Пауза
            </button>

            <button onclick="resetStopwatch()">
                ↻ Сброс
            </button>

        </div>

    </main>


    <script>

        /*
         * ==========================================
         * СЕКУНДОМЕР
         * ==========================================
         */

        let startTime = null;

        let elapsedTime = 0;

        let animationFrame = null;

        let running = false;


        /*
         * Форматирование времени
         *
         * 00:00:00
         */

        function formatTime(milliseconds) {

            const totalSeconds =
                Math.floor(milliseconds / 1000);


            const hours =
                Math.floor(totalSeconds / 3600);


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );


            const seconds =
                totalSeconds % 60;


            return (
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0")
            );
        }


        /*
         * Обновление экрана
         */

        function updateStopwatch() {

            if (!running) {
                return;
            }


            const now = performance.now();


            elapsedTime =
                now - startTime;


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);


            animationFrame =
                requestAnimationFrame(
                    updateStopwatch
                );
        }


        /*
         * Старт
         */

        function startStopwatch() {

            if (running) {
                return;
            }


            running = true;


            /*
             * Восстанавливаем правильное
             * время после паузы.
             */

            startTime =
                performance.now() - elapsedTime;


            animationFrame =
                requestAnimationFrame(
                    updateStopwatch
                );
        }


        /*
         * Пауза
         */

        function pauseStopwatch() {

            if (!running) {
                return;
            }


            running = false;


            /*
             * Фиксируем последнее значение.
             */

            elapsedTime =
                performance.now() - startTime;


            cancelAnimationFrame(
                animationFrame
            );


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);
        }


        /*
         * Сброс
         */

        function resetStopwatch() {

            running = false;


            cancelAnimationFrame(
                animationFrame
            );


            startTime = null;

            elapsedTime = 0;


            document.getElementById(
                "stopwatch"
            ).textContent =
                "00:00:00";
        }


        /*
         * ==========================================
         * НАСТРОЙКИ ФОНА
         * ==========================================
         */

        function toggleSettings() {

            const panel =
                document.getElementById(
                    "settingsPanel"
                );


            panel.classList.toggle("open");
        }


        /*
         * Цвет фона
         */

        document
            .getElementById("backgroundColor")
            .addEventListener(
                "input",
                function () {

                    const color = this.value;


                    document.body.style
                        .backgroundColor =
                        color;


                    localStorage.setItem(
                        "backgroundColor",
                        color
                    );
                }
            );


        /*
         * Изображение фона
         */

        document
            .getElementById("backgroundUrl")
            .addEventListener(
                "change",
                function () {

                    const url =
                        this.value.trim();


                    if (!url) {
                        return;
                    }


                    document.body.style
                        .backgroundImage =
                        `url("${url}")`;


                    localStorage.setItem(
                        "backgroundImage",
                        url
                    );
                }
            );


        /*
         * Сброс фона
         */

        function resetBackground() {

            document.body.style
                .backgroundImage =
                "none";


            document.body.style
                .backgroundColor =
                "#171717";


            document
                .getElementById("backgroundColor")
                .value =
                "#171717";


            document
                .getElementById("backgroundUrl")
                .value =
                "";


            localStorage.removeItem(
                "backgroundImage"
            );


            localStorage.setItem(
                "backgroundColor",
                "#171717"
            );
        }


        /*
         * Загрузка сохранённого фона
         */

        function loadBackground() {

            const savedColor =
                localStorage.getItem(
                    "backgroundColor"
                );


            const savedImage =
                localStorage.getItem(
                    "backgroundImage"
                );


            if (savedColor) {

                document.body.style
                    .backgroundColor =
                    savedColor;


                document
                    .getElementById(
                        "backgroundColor"
                    )
                    .value =
                    savedColor;
            }


            if (savedImage) {

                document.body.style
                    .backgroundImage =
                    `url("${savedImage}")`;


                document
                    .getElementById(
                        "backgroundUrl"
                    )
                    .value =
                    savedImage;
            }
        }


        /*
         * Инициализация
         */

        loadBackground();

    </script>

</body>
</html>
