<body>


    <!-- Затемнение -->

    <div class="overlay"></div>


    <!-- ==========================================
         КНОПКА НАСТРОЕК
         ========================================== -->

    <button
        class="settings-button"
        onclick="toggleSettings()"
        aria-label="Настройки"
    >
        ⚙
    </button>


    <!-- ==========================================
         ПАНЕЛЬ НАСТРОЕК
         ========================================== -->

    <div
        class="settings-panel"
        id="settingsPanel"
    >

        <h2>Настройки фона</h2>


        <label for="backgroundColor">
            Цвет фона
        </label>


        <input
            type="color"
            id="backgroundColor"
            value="#171717"
        >


        <label for="backgroundUrl">
            URL изображения
        </label>


        <input
            type="text"
            id="backgroundUrl"
            placeholder="https://example.com/image.jpg"
        >


        <button
            class="reset-background"
            onclick="resetBackground()"
        >
            Сбросить фон
        </button>


        <div class="hint">
            Настройки фона сохраняются в браузере.
        </div>

    </div>


    <!-- ==========================================
         СЕКУНДОМЕР
         ========================================== -->

    <main class="container">


        <div class="title">
            КОФЕ-БРЕЙК
        </div>


        <div
            class="stopwatch"
            id="stopwatch"
        >
            00:00:00
        </div>


        <!-- ======================================
             КНОПКИ
             ====================================== -->

        <div class="controls">


            <button onclick="startStopwatch()">
                ▶ Старт
            </button>


            <button onclick="pauseStopwatch()">
                ⏸ Пауза
            </button>


            <button onclick="resetStopwatch()">
                ↻ Сброс
            </button>


        </div>


        <!-- ======================================
             РУЧНАЯ УСТАНОВКА
             ====================================== -->

        <div class="time-setting">


            <input
                type="number"
                id="hoursInput"
                min="0"
                max="99"
                value="0"
                placeholder="Ч"
            >


            <span>:</span>


            <input
                type="number"
                id="minutesInput"
                min="0"
                max="59"
                value="0"
                placeholder="М"
            >


            <span>:</span>


            <input
                type="number"
                id="secondsInput"
                min="0"
                max="59"
                value="0"
                placeholder="С"
            >


            <button onclick="setStartTime()">
                Установить
            </button>


        </div>


    </main>


    <script>


        /* ==========================================
           СЕКУНДОМЕР
           ========================================== */


        let startTime = null;

        let elapsedTime = 0;

        let animationFrame = null;

        let running = false;


        /*
         * Форматирование времени
         */

        function formatTime(milliseconds) {

            const totalSeconds =
                Math.floor(milliseconds / 1000);


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );


            const seconds =
                totalSeconds % 60;


            return (
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0")
            );
        }


        /*
         * Обновление секундомера
         */

        function updateStopwatch() {

            if (!running) {
                return;
            }


            const now =
                performance.now();


            elapsedTime =
                now - startTime;


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);


            animationFrame =
                requestAnimationFrame(
                    updateStopwatch
                );
        }


        /*
         * Старт
         */

        function startStopwatch() {

            if (running) {
                return;
            }


            running = true;


            startTime =
                performance.now() -
                elapsedTime;


            animationFrame =
                requestAnimationFrame(
                    updateStopwatch
                );
        }


        /*
         * Пауза
         */

        function pauseStopwatch() {

            if (!running) {
                return;
            }


            running = false;


            elapsedTime =
                performance.now() -
                startTime;


            cancelAnimationFrame(
                animationFrame
            );


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);
        }


        /*
         * Сброс
         */

        function resetStopwatch() {

            running = false;


            cancelAnimationFrame(
                animationFrame
            );


            startTime = null;

            elapsedTime = 0;


            document.getElementById(
                "stopwatch"
            ).textContent =
                "00:00:00";


            document.getElementById(
                "hoursInput"
            ).value = 0;


            document.getElementById(
                "minutesInput"
            ).value = 0;


            document.getElementById(
                "secondsInput"
            ).value = 0;
        }


        /* ==========================================
           РУЧНАЯ УСТАНОВКА ВРЕМЕНИ
           ========================================== */


        function setStartTime() {

            /*
             * Если секундомер работает,
             * останавливаем его.
             */

            if (running) {
                pauseStopwatch();
            }


            let hours =
                parseInt(
                    document.getElementById(
                        "hoursInput"
                    ).value
                ) || 0;


            let minutes =
                parseInt(
                    document.getElementById(
                        "minutesInput"
                    ).value
                ) || 0;


            let seconds =
                parseInt(
                    document.getElementById(
                        "secondsInput"
                    ).value
                ) || 0;


            /*
             * Ограничиваем значения
             */

            hours =
                Math.max(
                    0,
                    Math.min(99, hours)
                );


            minutes =
                Math.max(
                    0,
                    Math.min(59, minutes)
                );


            seconds =
                Math.max(
                    0,
                    Math.min(59, seconds)
                );


            /*
             * Записываем время
             */

            elapsedTime =
                (
                    hours * 3600 +
                    minutes * 60 +
                    seconds
                ) * 1000;


            /*
             * Показываем его
             */

            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);
        }


        /* ==========================================
           НАСТРОЙКИ ФОНА
           ========================================== */


        function toggleSettings() {

            const panel =
                document.getElementById(
                    "settingsPanel"
                );


            panel.classList.toggle("open");
        }


        /*
         * Цвет фона
         */

        document
            .getElementById("backgroundColor")
            .addEventListener(
                "input",
                function () {

                    const color =
                        this.value;


                    document.body.style
                        .backgroundColor =
                        color;


                    localStorage.setItem(
                        "backgroundColor",
                        color
                    );
                }
            );


        /*
         * Изображение фона
         */

        document
            .getElementById("backgroundUrl")
            .addEventListener(
                "change",
                function () {

                    const url =
                        this.value.trim();


                    if (!url) {
                        return;
                    }


                    document.body.style
                        .backgroundImage =
                        `url("${url}")`;


                    localStorage.setItem(
                        "backgroundImage",
                        url
                    );
                }
            );


        /*
         * Сброс фона
         */

        function resetBackground() {

            document.body.style
                .backgroundImage =
                "none";


            document.body.style
                .backgroundColor =
                "#171717";


            document
                .getElementById(
                    "backgroundColor"
                )
                .value =
                "#171717";


            document
                .getElementById(
                    "backgroundUrl"
                )
                .value =
                "";


            localStorage.removeItem(
                "backgroundImage"
            );


            localStorage.setItem(
                "backgroundColor",
                "#171717"
            );
        }


        /*
         * Загрузка сохранённого фона
         */

        function loadBackground() {

            const savedColor =
                localStorage.getItem(
                    "backgroundColor"
                );


            const savedImage =
                localStorage.getItem(
                    "backgroundImage"
                );


            if (savedColor) {

                document.body.style
                    .backgroundColor =
                    savedColor;


                document
                    .getElementById(
                        "backgroundColor"
                    )
                    .value =
                    savedColor;
            }


            if (savedImage) {

                document.body.style
                    .backgroundImage =
                    `url("${savedImage}")`;


                document
                    .getElementById(
                        "backgroundUrl"
                    )
                    .value =
                    savedImage;
            }
        }


        /*
         * Инициализация
         */

        loadBackground();

    </script>

</body>
</html>
