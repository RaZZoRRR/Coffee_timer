<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ДНД-ТАЙМ</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #171717;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;

            overflow: hidden;

            transition:
                background-color 0.3s ease,
                background-image 0.3s ease;
        }


        /* ==========================================
           ЗАТЕМНЕНИЕ ФОНА
           ========================================== */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.25);

            pointer-events: none;
        }


        /* ==========================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ========================================== */

        .container {
            position: relative;

            z-index: 2;

            width: 100%;

            text-align: center;

            padding: 40px;
        }


        /* ==========================================
           ЗАГОЛОВОК
           ========================================== */

        .title {
            font-size: 120px !important;

            font-weight: 700;

            letter-spacing: 5px;

            line-height: 1;

            margin-bottom: 50px;

            white-space: nowrap;

            text-shadow:
                0 5px 30px rgba(0, 0, 0, 0.8);
        }


        /* ==========================================
           ТАЙМЕР
           ========================================== */

        .timer-row {
            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            width: 100%;
        }


        .stopwatch {
            font-size: 180px !important;

            font-weight: 700;

            letter-spacing: 5px;

            line-height: 1;

            font-variant-numeric: tabular-nums;

            white-space: nowrap;

            text-shadow:
                0 5px 30px rgba(0, 0, 0, 0.8);

            position: relative;

            z-index: 2;
        }


        /* ==========================================
           ДИАГОНАЛЬНАЯ СТРЕЛКА
           ========================================== */

        .arrow {
            position: absolute;

            left: calc(50% + 350px);

            top: 50%;

            width: 700px;

            height: 6px;

            background: white;

            transform-origin: left center;

            transform: rotate(35deg);

            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.7);

            animation:
                arrowBlink 1s steps(1, end) infinite;

            z-index: 1;

            user-select: none;
        }


        .arrow::after {
            content: "";

            position: absolute;

            right: -2px;

            top: 50%;

            width: 35px;

            height: 35px;

            border-top: 6px solid white;

            border-right: 6px solid white;

            transform:
                translateY(-50%)
                rotate(45deg);
        }


        /* ==========================================
           РЕЗКОЕ МИГАНИЕ
           ========================================== */

        @keyframes arrowBlink {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }

        }


        /* ==========================================
           ОСНОВНЫЕ КНОПКИ
           ========================================== */

        .controls {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            margin-top: 60px;

            flex-wrap: wrap;
        }


        button {
            border: none;

            padding: 18px 35px;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.92);

            color: #111;

            font-size: 28px !important;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }


        button:hover {
            background: white;

            transform: translateY(-2px);
        }


        button:active {
            transform: translateY(0);
        }


        /* ==========================================
           КНОПКА GIF
           ========================================== */

        .gif-button {
            background: rgba(255, 255, 255, 0.92);
        }


        /* ==========================================
           РУЧНАЯ УСТАНОВКА ВРЕМЕНИ
           ========================================== */

        .time-setting {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;
        }


        .time-setting input {
            width: 90px;

            height: 55px;

            padding: 10px;

            border: none;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.92);

            color: #111;

            font-size: 24px;

            text-align: center;

            outline: none;
        }


        .time-setting input:focus {
            background: white;
        }


        .time-setting span {
            color: white;

            font-size: 28px;

            font-weight: bold;
        }


        .time-setting button {
            margin-left: 12px;

            padding: 13px 22px;

            font-size: 18px !important;
        }


        /* ==========================================
           КНОПКА НАСТРОЕК
           ========================================== */

        .settings-button {
            position: fixed;

            top: 30px;

            right: 30px;

            z-index: 10;

            width: 65px;

            height: 65px;

            padding: 0;

            border-radius: 50%;

            font-size: 30px !important;
        }


        /* ==========================================
           ПАНЕЛЬ НАСТРОЕК
           ========================================== */

        .settings-panel {
            position: fixed;

            top: 110px;

            right: 30px;

            z-index: 10;

            width: 420px;

            max-height: calc(100vh - 140px);

            overflow-y: auto;

            padding: 30px;

            border-radius: 20px;

            background: rgba(20, 20, 20, 0.95);

            color: white;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.6);

            display: none;
        }


        .settings-panel.open {
            display: block;
        }


        .settings-panel h2 {
            margin-top: 0;

            margin-bottom: 25px;

            font-size: 26px;
        }


        .settings-panel label {
            display: block;

            margin-top: 20px;

            margin-bottom: 8px;

            font-size: 18px;
        }


        /* ==========================================
           НАЗВАНИЕ
           ========================================== */

        .title-input {
            width: 100%;

            padding: 14px;

            border: 1px solid #555;

            border-radius: 10px;

            background: #292929;

            color: white;

            outline: none;

            font-size: 18px;
        }


        .title-input:focus {
            border-color: #aaa;
        }


        .title-button {
            width: 100%;

            margin-top: 12px;

            padding: 14px 20px;

            font-size: 18px !important;
        }


        /* ==========================================
           ЦВЕТ ФОНА
           ========================================== */

        .settings-panel input[type="color"] {
            width: 100%;

            height: 55px;

            padding: 0;

            border: none;

            cursor: pointer;
        }


        /* ==========================================
           URL ФОНА
           ========================================== */

        .settings-panel input[type="text"] {
            width: 100%;

            padding: 14px;

            border: 1px solid #555;

            border-radius: 10px;

            background: #292929;

            color: white;

            outline: none;

            font-size: 16px;
        }


        .settings-panel input[type="text"]:focus {
            border-color: #aaa;
        }


        .settings-panel .reset-background {
            width: 100%;

            margin-top: 25px;

            font-size: 18px !important;
        }


        /* ==========================================
           ПЕРЕКЛЮЧАТЕЛЬ СТРЕЛКИ
           ========================================== */

        .arrow-setting {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: 25px;

            padding: 15px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);
        }


        .arrow-setting span {
            font-size: 18px;
        }


        .arrow-checkbox {
            width: 25px;

            height: 25px;

            cursor: pointer;
        }


        .hint {
            margin-top: 15px;

            color: #aaa;

            font-size: 14px;

            line-height: 1.4;
        }


        /* ==========================================
           GIF FULLSCREEN
           ========================================== */

        .gif-viewer {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            background: #000;
        }


        .gif-viewer.open {
            display: flex;
        }


        .gif-viewer img {
            width: 100vw;

            height: 100vh;

            object-fit: contain;

            display: block;

            user-select: none;

            -webkit-user-drag: none;
        }


        .gif-close {
            position: absolute;

            top: 25px;

            right: 30px;

            z-index: 10000;

            width: 65px;

            height: 65px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.2);

            color: white;

            font-size: 40px !important;

            line-height: 65px;

            cursor: pointer;
        }


        .gif-close:hover {
            background: rgba(255, 255, 255, 0.4);
        }


        /* ==========================================
           МОБИЛЬНЫЕ УСТРОЙСТВА
           ========================================== */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }


            .title {
                font-size: 60px !important;

                letter-spacing: 2px;

                margin-bottom: 30px;

                white-space: normal;
            }


            .timer-row {
                gap: 15px;
            }


            .stopwatch {
                font-size: 80px !important;

                letter-spacing: 2px;
            }


            .arrow {
                left: calc(50% + 145px);

                width: 300px;

                height: 4px;

                transform: rotate(35deg);
            }


            .arrow::after {
                width: 22px;

                height: 22px;

                border-top-width: 4px;

                border-right-width: 4px;
            }


            .controls {
                margin-top: 35px;

                gap: 10px;
            }


            .controls button {
                font-size: 18px !important;

                padding: 12px 20px;
            }


            .time-setting {
                margin-top: 20px;
            }


            .time-setting input {
                width: 55px;

                height: 45px;

                font-size: 16px;
            }


            .time-setting span {
                font-size: 20px;
            }


            .time-setting button {
                margin-left: 5px;

                padding: 10px 14px;

                font-size: 14px !important;
            }


            .settings-button {
                top: 15px;

                right: 15px;

                width: 45px;

                height: 45px;

                font-size: 20px !important;
            }


            .settings-panel {
                top: 70px;

                right: 10px;

                left: 10px;

                width: auto;

                padding: 20px;
            }


            .gif-close {
                top: 15px;

                right: 15px;

                width: 50px;

                height: 50px;

                line-height: 50px;

                font-size: 32px !important;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         ЗАТЕМНЕНИЕ ФОНА
         ========================================== -->

    <div class="overlay"></div>


    <!-- ==========================================
         КНОПКА НАСТРОЕК
         ========================================== -->

    <button
        class="settings-button"
        onclick="toggleSettings()"
        aria-label="Настройки"
    >
        ⚙
    </button>


    <!-- ==========================================
         ПАНЕЛЬ НАСТРОЕК
         ========================================== -->

    <div
        class="settings-panel"
        id="settingsPanel"
    >

        <h2>Настройки</h2>


        <!-- НАЗВАНИЕ -->

        <label for="titleInput">
            Название
        </label>


        <input
            type="text"
            class="title-input"
            id="titleInput"
            value="КОФЕ-БРЕЙК"
            placeholder="Введите название"
        >


        <button
            class="title-button"
            onclick="setTitle()"
        >
            Сохранить название
        </button>


        <!-- СТРЕЛКА -->

        <div class="arrow-setting">

            <span>
                Показывать стрелку →
            </span>


            <input
                type="checkbox"
                class="arrow-checkbox"
                id="arrowCheckbox"
                checked
                onchange="toggleArrow()"
            >

        </div>


        <!-- ЦВЕТ ФОНА -->

        <label for="backgroundColor">
            Цвет фона
        </label>


        <input
            type="color"
            id="backgroundColor"
            value="#171717"
        >


        <!-- ИЗОБРАЖЕНИЕ ФОНА -->

        <label for="backgroundUrl">
            URL изображения
        </label>


        <input
            type="text"
            id="backgroundUrl"
            placeholder="https://example.com/image.jpg"
        >


        <!-- СБРОС ФОНА -->

        <button
            class="reset-background"
            onclick="resetBackground()"
        >
            Сбросить фон
        </button>


        <div class="hint">
            Настройки сохраняются в браузере.
        </div>

    </div>


    <!-- ==========================================
         ОСНОВНОЙ ЭКРАН
         ========================================== -->

    <main class="container">


        <div
            class="title"
            id="title"
        >
            КОФЕ-БРЕЙК
        </div>


        <div class="timer-row">


            <div
                class="stopwatch"
                id="stopwatch"
            >
                00:00:00
            </div>


            <div
                class="arrow"
                id="arrow"
            ></div>


        </div>


        <!-- ======================================
             КНОПКИ
             ====================================== -->

        <div class="controls">


            <button onclick="startStopwatch()">
                ▶ Старт
            </button>


            <button onclick="pauseStopwatch()">
                ⏸ Пауза
            </button>


            <button onclick="resetStopwatch()">
                ↻ Сброс
            </button>


            <button
                class="gif-button"
                onclick="openGif()"
            >
                🎬 GIF
            </button>


        </div>


        <!-- ======================================
             РУЧНАЯ УСТАНОВКА ВРЕМЕНИ
             ====================================== -->

        <div class="time-setting">


            <input
                type="number"
                id="hoursInput"
                min="0"
                max="99"
                value="0"
                placeholder="Ч"
            >


            <span>:</span>


            <input
                type="number"
                id="minutesInput"
                min="0"
                max="59"
                value="0"
                placeholder="М"
            >


            <span>:</span>


            <input
                type="number"
                id="secondsInput"
                min="0"
                max="59"
                value="0"
                placeholder="С"
            >


            <button onclick="setStartTime()">
                Установить
            </button>


        </div>


    </main>


    <!-- ==========================================
         GIF VIEWER
         ========================================== -->

    <div
        class="gif-viewer"
        id="gifViewer"
    >


        <button
            class="gif-close"
            onclick="closeGif()"
            aria-label="Закрыть GIF"
        >
            ×
        </button>


        <img
            id="gifImage"
            src="coffee.gif"
            alt="GIF"
        >


    </div>


    <script>


        /* ==========================================
           СЕКУНДОМЕР
           ========================================== */

        let startTime = null;

        let elapsedTime = 0;

        let animationFrame = null;

        let running = false;


        /*
         * Форматирование времени
         */

        function formatTime(milliseconds) {

            const totalSeconds =
                Math.floor(
                    milliseconds / 1000
                );


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );


            const seconds =
                totalSeconds % 60;


            return (
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0")
            );

        }


        /*
         * Обновление секундомера
         */

        function updateStopwatch() {

            if (!running) {
                return;
            }


            const now =
                performance.now();


            elapsedTime =
                now - startTime;


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);


            animationFrame =
                requestAnimationFrame(
                    updateStopwatch
                );

        }


        /*
         * Старт
         */

        function startStopwatch() {

            if (running) {
                return;
            }


            running = true;


            startTime =
                performance.now() -
                elapsedTime;


            animationFrame =
                requestAnimationFrame(
                    updateStopwatch
                );

        }


        /*
         * Пауза
         */

        function pauseStopwatch() {

            if (!running) {
                return;
            }


            running = false;


            elapsedTime =
                performance.now() -
                startTime;


            cancelAnimationFrame(
                animationFrame
            );


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);

        }


        /*
         * Сброс
         */

        function resetStopwatch() {

            running = false;


            cancelAnimationFrame(
                animationFrame
            );


            startTime = null;

            elapsedTime = 0;


            document.getElementById(
                "stopwatch"
            ).textContent =
                "00:00:00";


            document.getElementById(
                "hoursInput"
            ).value = 0;


            document.getElementById(
                "minutesInput"
            ).value = 0;


            document.getElementById(
                "secondsInput"
            ).value = 0;

        }


        /* ==========================================
           РУЧНАЯ УСТАНОВКА ВРЕМЕНИ
           ========================================== */

        function setStartTime() {

            if (running) {
                pauseStopwatch();
            }


            let hours =
                parseInt(
                    document.getElementById(
                        "hoursInput"
                    ).value
                ) || 0;


            let minutes =
                parseInt(
                    document.getElementById(
                        "minutesInput"
                    ).value
                ) || 0;


            let seconds =
                parseInt(
                    document.getElementById(
                        "secondsInput"
                    ).value
                ) || 0;


            hours =
                Math.max(
                    0,
                    Math.min(99, hours)
                );


            minutes =
                Math.max(
                    0,
                    Math.min(59, minutes)
                );


            seconds =
                Math.max(
                    0,
                    Math.min(59, seconds)
                );


            elapsedTime =
                (
                    hours * 3600 +
                    minutes * 60 +
                    seconds
                ) * 1000;


            document.getElementById(
                "stopwatch"
            ).textContent =
                formatTime(elapsedTime);

        }


        /* ==========================================
           ИЗМЕНЕНИЕ НАЗВАНИЯ
           ========================================== */

        function setTitle() {

            const input =
                document.getElementById(
                    "titleInput"
                );


            const title =
                input.value.trim();


            if (!title) {
                return;
            }


            document.getElementById(
                "title"
            ).textContent =
                title;


            document.title =
                title;


            localStorage.setItem(
                "pageTitle",
                title
            );

        }


        /* ==========================================
           СТРЕЛКА
           ========================================== */

        function toggleArrow() {

            const checkbox =
                document.getElementById(
                    "arrowCheckbox"
                );


            const arrow =
                document.getElementById(
                    "arrow"
                );


            if (checkbox.checked) {

                arrow.style.display =
                    "block";


                localStorage.setItem(
                    "showArrow",
                    "true"
                );

            } else {

                arrow.style.display =
                    "none";


                localStorage.setItem(
                    "showArrow",
                    "false"
                );

            }

        }


        /* ==========================================
           НАСТРОЙКИ
           ========================================== */

        function toggleSettings() {

            const panel =
                document.getElementById(
                    "settingsPanel"
                );


            panel.classList.toggle(
                "open"
            );

        }


        /* ==========================================
           ЦВЕТ ФОНА
           ========================================== */

        document
            .getElementById("backgroundColor")
            .addEventListener(
                "input",
                function () {

                    const color =
                        this.value;


                    document.body.style
                        .backgroundColor =
                        color;


                    document.body.style
                        .backgroundImage =
                        "none";


                    localStorage.setItem(
                        "backgroundColor",
                        color
                    );


                    localStorage.removeItem(
                        "backgroundImage"
                    );

                }
            );


        /* ==========================================
           ИЗОБРАЖЕНИЕ ФОНА
           ========================================== */

        document
            .getElementById("backgroundUrl")
            .addEventListener(
                "change",
                function () {

                    const url =
                        this.value.trim();


                    if (!url) {
                        return;
                    }


                    document.body.style
                        .backgroundImage =
                        `url("${url}")`;


                    localStorage.setItem(
                        "backgroundImage",
                        url
                    );

                }
            );


        /* ==========================================
           СБРОС ФОНА
           ========================================== */

        function resetBackground() {

            document.body.style
                .backgroundImage =
                "none";


            document.body.style
                .backgroundColor =
                "#171717";


            document
                .getElementById(
                    "backgroundColor"
                )
                .value =
                "#171717";


            document
                .getElementById(
                    "backgroundUrl"
                )
                .value =
                "";


            localStorage.removeItem(
                "backgroundImage"
            );


            localStorage.setItem(
                "backgroundColor",
                "#171717"
            );

        }


        /* ==========================================
           GIF
           ========================================== */

        const GIF_FILE =
            "coffee.gif";


        function openGif() {

            const viewer =
                document.getElementById(
                    "gifViewer"
                );


            const image =
                document.getElementById(
                    "gifImage"
                );


            /*
             * Перезагружаем GIF с новым
             * timestamp, чтобы анимация
             * всегда начиналась с начала.
             */

            image.src =
                GIF_FILE +
                "?t=" +
                Date.now();


            viewer.classList.add(
                "open"
            );


            /*
             * Пытаемся включить настоящий
             * полноэкранный режим.
             */

            if (
                viewer.requestFullscreen
            ) {

                viewer
                    .requestFullscreen()
                    .catch(
                        () => {}
                    );

            }

        }


        function closeGif() {

            const viewer =
                document.getElementById(
                    "gifViewer"
                );


            viewer.classList.remove(
                "open"
            );


            /*
             * Выход из настоящего
             * fullscreen режима.
             */

            if (
                document.fullscreenElement
            ) {

                document
                    .exitFullscreen()
                    .catch(
                        () => {}
                    );

            }

        }


        /*
         * ESC закрывает GIF
         */

        document.addEventListener(
            "keydown",
            function(event) {

                const viewer =
                    document.getElementById(
                        "gifViewer"
                    );


                if (
                    event.key === "Escape" &&
                    viewer.classList.contains(
                        "open"
                    )
                ) {

                    closeGif();

                }

            }
        );


        /*
         * Клик по затемнённому фону
         * тоже закрывает GIF.
         */

        document
            .getElementById("gifViewer")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === this
                    ) {

                        closeGif();

                    }

                }
            );


        /* ==========================================
           ЗАГРУЗКА СОХРАНЁННЫХ НАСТРОЕК
           ========================================== */

        function loadSettings() {

            /*
             * Название
             */

            const savedTitle =
                localStorage.getItem(
                    "pageTitle"
                );


            if (savedTitle) {

                document.getElementById(
                    "title"
                ).textContent =
                    savedTitle;


                document.getElementById(
                    "titleInput"
                ).value =
                    savedTitle;


                document.title =
                    savedTitle;

            }


            /*
             * Состояние стрелки
             */

            const savedArrow =
                localStorage.getItem(
                    "showArrow"
                );


            if (
                savedArrow === "false"
            ) {

                document.getElementById(
                    "arrow"
                ).style.display =
                    "none";


                document.getElementById(
                    "arrowCheckbox"
                ).checked =
                    false;

            } else {

                document.getElementById(
                    "arrow"
                ).style.display =
                    "block";


                document.getElementById(
                    "arrowCheckbox"
                ).checked =
                    true;

            }


            /*
             * Цвет
             */

            const savedColor =
                localStorage.getItem(
                    "backgroundColor"
                );


            /*
             * Изображение
             */

            const savedImage =
                localStorage.getItem(
                    "backgroundImage"
                );


            if (savedColor) {

                document.body.style
                    .backgroundColor =
                    savedColor;


                document
                    .getElementById(
                        "backgroundColor"
                    )
                    .value =
                    savedColor;

            }


            if (savedImage) {

                document.body.style
                    .backgroundImage =
                    `url("${savedImage}")`;


                document
                    .getElementById(
                        "backgroundUrl"
                    )
                    .value =
                    savedImage;

            }

        }


        /*
         * Запуск
         */

        loadSettings();


    </script>


</body>

</html>
